name: CACM Daily News

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（GitHub 可能延迟 5~20 分钟）
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force_id:
        description: "强制处理指定文章 id（留空 = 只处理最新未推送的 News）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cacm-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取 → 翻译 → 摘要/导图 → 发邮件
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          FORCE_ID: ${{ github.event.inputs.force_id }}
          CACM_SECTION: "0"
          TZ: Asia/Shanghai
          PYTHONUTF8: "1"
        run: python scripts/main.py

      - name: 回写状态与文章
        run: |
          git config user.name "cacm-bot"
          git config user.email "cacm-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore: CACM daily $(date -u +%Y-%m-%d)"
            git push
          fi
